<!doctype html><html><head><meta charset="utf-8"><title>documentary</title>
<!-- LOOK: documentary. Black and white on black, a glowing ring behind your head, a headline, a name bar and a Follow click. Needs: frames + cutout. -->
<link rel="stylesheet" href="base.css">
<style>
.dh{position:absolute;left:56px;top:150px;font-weight:900;font-size:112px;letter-spacing:-.05em;line-height:.92;color:#fff;text-transform:uppercase}
.lt{position:absolute;left:50px;top:1560px;display:flex;flex-direction:column;gap:8px}
.lt b{color:#fff;font-weight:900;font-size:46px;letter-spacing:.02em;padding:8px 22px;align-self:flex-start}
.lt i{font-style:normal;font-family:"Geist Mono";font-size:26px;color:#fff;background:rgba(0,0,0,.6);padding:6px 16px;align-self:flex-start}
.fb{position:absolute;left:640px;top:1385px;width:300px;height:96px;border-radius:20px;color:#fff;font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<script>
// ---- edit me ----
const CONFIG = { accent: "#2641D9", accentLight: "#7D93FF", kicker: "YOUR SERIES · DAILY", lines: ["One clip.", "One command."], last: "Full reel.",
                 name: "YOUR NAME", handle: "@yourhandle", ring: { x: 560, y: 800, r: 360 } };
</script>
<canvas class="full" id="v" width="1080" height="1920"></canvas>
<canvas class="full" id="fg" width="1080" height="1920"></canvas>
<div class="abs mono" id="kk" style="left:58px;top:104px;font-weight:700;font-size:24px;letter-spacing:.16em;color:rgba(255,255,255,.7)"></div>
<div class="dh" id="dh"></div>
<div class="fb" id="fb">Follow</div>
<svg id="cur" class="abs" width="64" height="64" viewBox="0 0 24 24"><path d="M5 2l14 11-6.5 1 3.6 7.2-2.6 1.2-3.5-7.2L5 20z" fill="#fff" stroke="#000" stroke-width="1.3"/></svg>
<div class="lt" id="lt"><b id="ln"></b><i id="lh"></i></div>
<script src="../work/frames.js"></script><script src="engine.js"></script>
<script>
const { cl, lerp, ease } = Look, $ = id => document.getElementById(id);
$("kk").textContent = CONFIG.kicker; $("dh").innerHTML = CONFIG.lines.join("<br>") + `<br><span style="color:${CONFIG.accentLight}">${CONFIG.last}</span>`;
$("ln").textContent = CONFIG.name; $("ln").style.background = CONFIG.accent; $("lh").textContent = CONFIG.handle;
const g = $("v").getContext("2d"), f = $("fg").getContext("2d");
Look.start(t => {
  g.fillStyle = "#0B0B0C"; g.fillRect(0, 0, 1080, 1920);
  if (!Look.hasCutout()) { g.filter = "grayscale(1) brightness(.5)"; Look.paint(g, Look.frame(t)); g.filter = "none"; }
  const rp = ease.out(cl((t - .05) / .4)), R = CONFIG.ring;
  g.save(); g.shadowColor = CONFIG.accent; g.shadowBlur = 60; g.strokeStyle = CONFIG.accent; g.lineWidth = 34; g.globalAlpha = rp;
  g.beginPath(); g.arc(R.x, R.y, lerp(R.r * .55, R.r, rp), 0, Math.PI * 2); g.stroke(); g.restore();
  f.clearRect(0, 0, 1080, 1920); f.filter = "grayscale(1) contrast(1.25) brightness(1.05)"; Look.paint(f, Look.cut(t)); f.filter = "none";
  const p = ease.out(cl((t - .15) / .35)); $("dh").style.opacity = p; $("dh").style.transform = `translateX(${lerp(-80, 0, p)}px)`;
  const q = ease.out(cl((t - .35) / .3)); $("lt").style.opacity = q; $("lt").style.transform = `translateX(${lerp(-60, 0, q)}px)`;
  const c0 = cl((t - .9) / .45), clk = t > 1.42, fb = $("fb"), cu = $("cur");
  fb.style.opacity = ease.out(cl((t - .5) / .2)); fb.textContent = clk ? "Following" : "Follow"; fb.style.background = clk ? "#3A3A3C" : "#0095F6";
  fb.style.transform = `scale(${t > 1.38 && t < 1.5 ? .92 : 1})`;
  cu.style.opacity = t > .85 ? 1 : 0; cu.style.left = lerp(980, 800, ease.inout(c0)) + "px"; cu.style.top = lerp(1700, 1440, ease.inout(c0)) + "px";
});
</script></body></html>

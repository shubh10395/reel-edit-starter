<!doctype html><html><head><meta charset="utf-8"><title>gaming</title>
<!-- LOOK: gaming. Boosted colours, a game HUD and a "Mission passed" stamp at chest level. Needs: frames. -->
<link rel="stylesheet" href="base.css">
<style>
.ol{text-shadow:4px 4px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 4px 0 #000;font-weight:900;font-style:italic}
.hud{position:absolute;right:50px;top:120px;text-align:right}
.mp{position:absolute;left:0;right:0;top:1140px;text-align:center;text-transform:uppercase}
</style></head><body>
<script>
// ---- edit me ----
const CONFIG = { time: "04:20", money: "$00193000", stars: 4, stamp: ["Mission", "passed"], sub: "+193K VIEWS" };
</script>
<canvas class="full" id="v" width="1080" height="1920"></canvas>
<div class="hud"><div class="ol" id="tm" style="font-size:84px;color:#7FC4FF"></div><div class="ol mono" id="mo" style="font-size:64px;color:#7CE36B"></div><div class="ol" id="st" style="font-size:52px;color:#FFD23F"></div></div>
<div class="mp" id="mp"><div class="ol" id="sa" style="font-size:132px;color:#FFD23F;line-height:.9"></div><div class="ol" id="ss" style="font-size:64px;color:#fff;margin-top:22px"></div></div>
<div class="abs" style="left:40px;bottom:60px;width:230px;height:230px;border-radius:50%;border:8px solid #111;background:radial-gradient(circle,#4E6B3A,#2C3F22);box-shadow:0 0 0 4px #FFD23F"></div>
<script src="../work/frames.js"></script><script src="engine.js"></script>
<script>
const { cl, lerp, ease } = Look, $ = id => document.getElementById(id);
$("tm").textContent = CONFIG.time; $("mo").textContent = CONFIG.money; $("st").innerHTML = "&#9733;".repeat(CONFIG.stars) + "&#9734;".repeat(5 - CONFIG.stars);
$("sa").innerHTML = CONFIG.stamp.join("<br>"); $("ss").textContent = CONFIG.sub;
const g = $("v").getContext("2d");
Look.start(t => {
  g.filter = "saturate(1.5) contrast(1.12) brightness(1.03)"; Look.paint(g, Look.frame(t)); g.filter = "none";
  const p = cl((t - .9) / .18); $("mp").style.opacity = p; $("mp").style.transform = `scale(${lerp(1.6, 1, ease.out(p))})`;
});
</script></body></html>
